<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KINTAI 根拠資料</title><style>:root{--ink:#172d29;--muted:#63746b;--green:#286b58;--paper:#fbfaf3;--line:#dce3d8}*{box-sizing:border-box}body{margin:0;background:#e7ebe3;color:var(--ink);font-family:"Yu Gothic UI","Noto Sans JP",sans-serif}.shell{max-width:1280px;margin:auto;padding:24px 4vw 36px}.top{display:flex;justify-content:space-between;margin-bottom:18px}.logo{font-weight:900;letter-spacing:.2em}.back{color:var(--green);font-weight:800;text-decoration:none}.card{padding:clamp(24px,4vw,48px);border:1px solid #d2ddd1;border-radius:24px;background:var(--paper);box-shadow:0 18px 55px #294b3b18}.eyebrow{color:var(--green);font-size:11px;letter-spacing:.16em;font-weight:900}.title{margin:12px 0 14px;font-size:clamp(28px,4vw,52px);line-height:1.2}.purpose{max-width:900px;color:var(--muted);font-size:17px;line-height:1.75}.guide{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px 0}.guide div{padding:16px;border:1px solid var(--line);border-radius:14px;background:white}.guide b{display:block;margin-bottom:6px;color:var(--green);font-size:11px}.guide span{color:var(--muted);font-size:13px;line-height:1.6}.source{display:flex;justify-content:space-between;gap:12px;margin:20px 0 12px;padding:12px 14px;border-radius:10px;background:#f0f4eb;color:#52665c;font-size:12px;word-break:break-all}.source a{color:var(--green);font-weight:800}.viewer{height:min(68vh,720px);overflow:auto;border:1px solid var(--line);border-radius:16px;background:white}.viewer iframe{width:100%;height:100%;border:0}.viewer pre{margin:0;padding:20px;font-family:Consolas,"Courier New",monospace;font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}.viewer .fallback-note{padding:10px 16px;border-bottom:1px solid var(--line);background:#fbf9f1;color:#7d5d2d;font-size:12px}.foot{margin-top:14px;color:#718077;font-size:12px;line-height:1.6}@media(max-width:720px){.guide{grid-template-columns:1fr}.viewer{height:62vh}}</style></head><body><main class="shell"><div class="top"><div class="logo">KINTAI<span style="color:#75a689">.</span></div><a id="back" class="back" href="index.html">← 発表に戻る</a></div><section class="card"><div class="eyebrow">EVIDENCE VIEWER</div><h1 id="title" class="title">根拠資料</h1><p id="purpose" class="purpose">確認する内容を読み込んでいます。</p><div class="guide"><div><b>この資料で見ること</b><span id="look">発表の主張を裏付ける原文の範囲を確認します。</span></div><div><b>注意する範囲</b><span id="limit">この資料だけでシステム全体の正常動作を意味するものではありません。</span></div></div><div class="source"><span id="sourceLabel">原本パス</span><a id="openSource" target="_blank" rel="noopener">新しいタブで原本を開く ↗</a></div><div class="viewer" id="viewer"><iframe id="frame" title="根拠原本"></iframe></div><p class="foot">発表スライド <span id="slideNo">-</span>から開いた資料です。ブラウザの戻るボタンを1回押すと、元の発表スライドに戻ります。</p></section></main><script>const q=new URLSearchParams(location.search),src=q.get("src")||"",title=q.get("title")||"根拠資料",purpose=q.get("purpose")||"確認する内容を読み込んでいます。",look=q.get("look")||purpose,slide=Number(q.get("slide")||0);document.title=title+" | KINTAI 根拠";document.querySelector("#title").textContent=title;document.querySelector("#purpose").textContent=purpose;document.querySelector("#look").textContent=look;document.querySelector("#sourceLabel").textContent=src||"原本パスなし";const viewer=document.querySelector("#viewer"),frame=document.querySelector("#frame"),source=document.querySelector("#openSource");source.href=src;document.querySelector("#slideNo").textContent=slide?String(slide).padStart(2,"0")+" / 20":"不明";const back=document.querySelector("#back");back.href="index.html#slide="+(slide||1);back.addEventListener("click",e=>{e.preventDefault();if(history.length>1)history.back();else location.href=back.href});if(src&&/\\.(md|json|xml|txt|log)$/i.test(src)){fetch(src).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}).then(text=>{const pre=document.createElement("pre");pre.textContent=text;viewer.innerHTML="";viewer.appendChild(pre)}).catch(()=>{const note=document.createElement("div");note.className="fallback-note";note.textContent="file://環境ではブラウザの制限によりプレビューできない場合があります。ローカルサーバーで開くか、右上の「新しいタブで原本を開く」を使用してください。";viewer.insertBefore(note,frame);frame.src=src})}else frame.src=src;</script></body></html>
