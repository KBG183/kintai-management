<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout(~{::title}, ~{::#content})}">
<head>
    <title>シフト管理 | KINTAI SYSTEM</title>
</head>
<body>
<div id="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h3 class="fw-bold mb-1"><i class="fa-regular fa-calendar-days text-primary me-2"></i>シフト管理・希望提出</h3>
            <p class="text-muted small mb-0">カレンダーの日付をクリックして希望シフトを登録、または登録済みシフトをクリックして確定します。</p>
        </div>
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-success">確定 (CONFIRMED)</span>
            <span class="badge bg-warning text-dark">申請中 (REQUESTED)</span>
            <span class="badge bg-secondary">却下 (REJECTED)</span>
        </div>
    </div>

    <!-- カレンダー本体カード -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-3">
            <div id="calendar"></div>
        </div>
    </div>

    <!-- 1. アルバイト用: 希望シフト提出モーダル -->
    <div class="modal fade" id="shiftRequestModal" tabindex="-1" aria-labelledby="shiftRequestModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="shiftRequestModalLabel"><i class="fa-solid fa-clock me-2"></i>希望シフト登録</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
                </div>
                <div class="modal-body">
                    <form id="shiftRequestForm">
                        <input type="hidden" id="reqStoreId" th:value="${storeId}">
                        <div class="mb-3">
                            <label class="form-label fw-bold">スタッフID</label>
                            <input type="number" class="form-control" id="reqStaffId" value="1" required>
                            <div class="form-text">テスト用: 1 = 山田 太郎, 2 = 佐藤 花子</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">勤務日</label>
                            <input type="date" class="form-control" id="reqWorkDate" readonly required>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold">希望出勤時刻</label>
                                <input type="time" class="form-control" id="reqStartTime" value="09:00" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold">希望退勤時刻</label>
                                <input type="time" class="form-control" id="reqEndTime" value="18:00" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">希望休憩時間 (分)</label>
                            <input type="number" class="form-control" id="reqBreakMinutes" value="60" min="0" step="15" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                    <button type="button" class="btn btn-primary" id="btnSubmitShiftRequest">希望提出</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. オーナー用: シフト確定モーダル -->
    <div class="modal fade" id="shiftConfirmModal" tabindex="-1" aria-labelledby="shiftConfirmModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="shiftConfirmModalLabel"><i class="fa-solid fa-clipboard-check me-2"></i>シフト確定 / 調整</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
                </div>
                <div class="modal-body">
                    <form id="shiftConfirmForm">
                        <input type="hidden" id="confShiftId">
                        <div class="mb-3">
                            <label class="form-label fw-bold">スタッフ名</label>
                            <input type="text" class="form-control-plaintext fw-bold" id="confStaffName" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">勤務日</label>
                            <input type="date" class="form-control" id="confWorkDate" readonly>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold">確定出勤時刻</label>
                                <input type="time" class="form-control" id="confStartTime" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold">確定退勤時刻</label>
                                <input type="time" class="form-control" id="confEndTime" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">確定休憩時間 (分)</label>
                            <input type="number" class="form-control" id="confBreakMinutes" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">ステータス</label>
                            <select class="form-select" id="confStatus">
                                <option value="CONFIRMED">確定 (CONFIRMED)</option>
                                <option value="REJECTED">却下 (REJECTED)</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
                    <button type="button" class="btn btn-success" id="btnSubmitShiftConfirm">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- FullCalendar初期化 & イベント処理スクリプト -->
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            const storeId = /*[[${storeId}]]*/ 1;
            const calendarEl = document.getElementById('calendar');
            const reqModal = new bootstrap.Modal(document.getElementById('shiftRequestModal'));
            const confModal = new bootstrap.Modal(document.getElementById('shiftConfirmModal'));

            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'ja',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                navLinks: true,
                editable: false,
                selectable: true,
                events: function (info, successCallback, failureCallback) {
                    const startStr = info.startStr.substring(0, 10);
                    const endStr = info.endStr.substring(0, 10);
                    fetch(`/api/shifts/events?storeId=${storeId}&start=${startStr}&end=${endStr}`)
                        .then(res => res.json())
                        .then(data => {
                            const events = data.map(ev => {
                                let bg = '#ffc107'; // REQUESTED
                                let border = '#e0a800';
                                let text = '#000000';
                                if (ev.status === 'CONFIRMED') {
                                    bg = '#198754';
                                    border = '#157347';
                                    text = '#ffffff';
                                } else if (ev.status === 'REJECTED' || ev.status === 'CANCELED') {
                                    bg = '#6c757d';
                                    border = '#5a6268';
                                    text = '#ffffff';
                                }
                                return {
                                    id: ev.shiftId,
                                    title: `${ev.staffName} (${ev.startTime.substring(0,5)}~${ev.endTime.substring(0,5)})`,
                                    start: `${ev.workDate}T${ev.startTime}`,
                                    end: `${ev.workDate}T${ev.endTime}`,
                                    backgroundColor: bg,
                                    borderColor: border,
                                    textColor: text,
                                    extendedProps: ev
                                };
                            });
                            successCallback(events);
                        })
                        .catch(err => {
                            console.error(err);
                            failureCallback(err);
                        });
                },
                dateClick: function (info) {
                    document.getElementById('reqWorkDate').value = info.dateStr;
                    reqModal.show();
                },
                eventClick: function (info) {
                    const ev = info.event.extendedProps;
                    document.getElementById('confShiftId').value = ev.shiftId;
                    document.getElementById('confStaffName').value = ev.staffName;
                    document.getElementById('confWorkDate').value = ev.workDate;
                    document.getElementById('confStartTime').value = ev.startTime.substring(0, 5);
                    document.getElementById('confEndTime').value = ev.endTime.substring(0, 5);
                    document.getElementById('confBreakMinutes').value = ev.breakMinutes || 60;
                    document.getElementById('confStatus').value = (ev.status === 'REJECTED') ? 'REJECTED' : 'CONFIRMED';
                    confModal.show();
                }
            });

            calendar.render();

            // 希望提出ボタン
            document.getElementById('btnSubmitShiftRequest').addEventListener('click', function () {
                const payload = {
                    storeStaffId: parseInt(document.getElementById('reqStaffId').value),
                    workDate: document.getElementById('reqWorkDate').value,
                    requestedStartTime: document.getElementById('reqStartTime').value + ':00',
                    requestedEndTime: document.getElementById('reqEndTime').value + ':00',
                    requestedBreakMinutes: parseInt(document.getElementById('reqBreakMinutes').value)
                };

                fetch('/api/shifts/request', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert(data.message || '希望シフトを登録しました。');
                        reqModal.hide();
                        calendar.refetchEvents();
                    } else {
                        alert('登録エラー: ' + data.message);
                    }
                })
                .catch(err => alert('通信エラーが発生しました: ' + err));
            });

            // 確定ボタン
            document.getElementById('btnSubmitShiftConfirm').addEventListener('click', function () {
                const shiftId = document.getElementById('confShiftId').value;
                const payload = {
                    confirmedStartTime: document.getElementById('confStartTime').value + ':00',
                    confirmedEndTime: document.getElementById('confEndTime').value + ':00',
                    confirmedBreakMinutes: parseInt(document.getElementById('confBreakMinutes').value),
                    shiftStatus: document.getElementById('confStatus').value
                };

                fetch(`/api/shifts/${shiftId}/confirm`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert(data.message || 'シフトを保存しました。');
                        confModal.hide();
                        calendar.refetchEvents();
                    } else {
                        alert('保存エラー: ' + data.message);
                    }
                })
                .catch(err => alert('通信エラーが発生しました: ' + err));
            });
        });
    </script>
</div>
</body>
</html>
