<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アクセス権限エラー - KINTAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container text-center">
    <div class="card shadow-sm mx-auto p-4 border-0" style="max-width: 500px;">
        <div class="card-body">
            <div class="text-danger mb-3">
                <i class="fa-solid fa-shield-halved fa-4x"></i>
            </div>
            <h4 class="card-title fw-bold text-dark mb-2">アクセス権限がありません</h4>
            <p class="text-muted small mb-4">
                要求されたリソース（403 Forbidden）へのアクセス権限が付与されていません。<br>
                管理者または店長へ権限設定をご確認ください。
            </p>
            <div class="d-grid gap-2">
                <a href="/" class="btn btn-primary fw-bold">
                    <i class="fa-solid fa-house me-1"></i>ホームへ戻る
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
