<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout(~{::title}, ~{::#content})}">
<head>
    <title>会員一覧（疎通確認サンプル） - 勤怠管理</title>
</head>
<body>

<div id="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="fw-bold mb-0">会員一覧（MyBatis 疎通確認サンプル）</h4>
            <p class="text-muted small mb-0">DB → MyBatis Mapper → Service → Controller → Thymeleaf のデータバインディング確認用画面</p>
        </div>
        <div>
            <button class="btn btn-outline-primary btn-sm" onclick="testFetchApi()">
                <i class="fa-solid fa-code me-1"></i>Fetch API（JSON）呼び出しテスト
            </button>
        </div>
    </div>

    <!-- 会員一覧テーブル -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white py-3">
            <h6 class="card-title fw-bold mb-0 text-primary">
                <i class="fa-solid fa-list me-1"></i>登録会員一覧（<span th:text="${#lists.size(members)}">0</span>名）
            </h6>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 80px;">ID</th>
                        <th>メールアドレス</th>
                        <th>氏名</th>
                        <th>電話番号</th>
                        <th>権限</th>
                        <th>状態</th>
                        <th>登録日時</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(members)}">
                        <td colspan="7" class="text-center py-4 text-muted">
                            <i class="fa-solid fa-triangle-exclamation mb-2 fs-4 d-block"></i>
                            登録されている会員がいません。<br>
                            先に <code>schema.sql</code> と <code>data.sql</code> を DB で実行してください。
                        </td>
                    </tr>
                    <tr th:each="m : ${members}">
                        <td class="fw-bold" th:text="${m.memberId}">1</td>
                        <td th:text="${m.email}">owner@kintai.com</td>
                        <td th:text="${m.name}">田中 太郎</td>
                        <td th:text="${m.phone}">090-1111-2222</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${m.role == 'ROLE_OWNER' ? 'bg-primary' : 'bg-success'}"
                                  th:text="${m.role == 'ROLE_OWNER' ? 'オーナー' : 'スタッフ'}">オーナー</span>
                        </td>
                        <td>
                            <span class="badge bg-secondary" th:text="${m.isActive ? '有効' : '無効'}">有効</span>
                        </td>
                        <td class="small text-muted" th:text="${m.createdAt != null ? #temporals.format(m.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- API レスポンス表示エリア -->
    <div class="card shadow-sm border-0 d-none" id="apiResultCard">
        <div class="card-header bg-dark text-white py-2">
            <span class="small fw-bold"><i class="fa-solid fa-terminal me-1"></i>GET /api/members レスポンス（JSON）</span>
        </div>
        <div class="card-body bg-light">
            <pre id="apiResultPre" class="mb-0" style="max-height: 200px; overflow-y: auto; font-size: 0.85rem;"></pre>
        </div>
    </div>

    <script>
        function testFetchApi() {
            fetch('/api/members')
                .then(res => res.json())
                .then(data => {
                    const card = document.getElementById('apiResultCard');
                    const pre = document.getElementById('apiResultPre');
                    card.classList.remove('d-none');
                    pre.textContent = JSON.stringify(data, null, 2);
                })
                .catch(err => {
                    alert('API 呼び出しに失敗しました: ' + err);
                });
        }
    </script>
</div>

</body>
</html>
