<!DOCTYPE html>
<!--
  共通レイアウト (layout fragment)
  各画面からの呼び出し方:
    <html lang="ja" xmlns:th="http://www.thymeleaf.org"
          th:replace="~{common/layout :: layout(~{::title}, ~{::#content})}">
    <head><title>画面タイトル</title></head>
    <body><div id="content"> ...本文... </div></body>
    </html>
-->
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">勤怠・シフト・給与管理システム</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- FullCalendar 6.1.15 + 日本語ロケール -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales/ja.global.min.js"></script>
    <!-- Bootstrap JS / jQuery: 本文内のインラインスクリプトから使えるよう head で読み込む -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-brand {
            font-weight: 700;
            color: #0d6efd !important;
        }
        main {
            flex: 1;
        }
        footer {
            background-color: #ffffff;
            border-top: 1px solid #dee2e6;
        }
    </style>
</head>
<body>

    <!-- 共通ナビゲーションバー
         ※ 開発初期(未ログイン=匿名)は全メニューを表示し、ログイン後は権限ごとに出し分ける -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fa-solid fa-business-time me-2"></i>KINTAI SYSTEM
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item" sec:authorize="isAnonymous()">
                        <a class="nav-link" href="/members/sample"><i class="fa-solid fa-users me-1"></i>会員一覧（サンプル）</a>
                    </li>
                    <!-- オーナー用 -->
                    <li class="nav-item" sec:authorize="isAnonymous() or hasRole('OWNER')">
                        <a class="nav-link" href="/stores"><i class="fa-solid fa-store me-1"></i>店舗管理</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAnonymous() or hasRole('OWNER')">
                        <a class="nav-link" href="/shifts"><i class="fa-regular fa-calendar-days me-1"></i>シフト管理</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAnonymous() or hasRole('OWNER')">
                        <a class="nav-link" href="/attendance/mod-requests"><i class="fa-solid fa-user-check me-1"></i>勤怠承認</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAnonymous() or hasRole('OWNER')">
                        <a class="nav-link" href="/payroll"><i class="fa-solid fa-file-invoice-dollar me-1"></i>給与計算</a>
                    </li>
                    <!-- スタッフ用 -->
                    <li class="nav-item" sec:authorize="hasRole('STAFF')">
                        <a class="nav-link" href="/shifts"><i class="fa-regular fa-calendar-days me-1"></i>希望シフト提出</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAnonymous() or hasRole('STAFF')">
                        <a class="nav-link" href="/attendance"><i class="fa-solid fa-clock me-1"></i>勤怠打刻</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <span sec:authorize="isAnonymous()" class="badge bg-secondary">開発モード（未ログイン）</span>
                    <span sec:authorize="isAuthenticated()" class="text-muted small">
                        <span sec:authentication="name">user</span> さん
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <!-- 各画面の本文 -->
    <main class="container my-4">
        <div th:replace="${content}">
            <p>本文エリア</p>
        </div>
    </main>

    <!-- 共通フッター -->
    <footer class="py-3 text-center text-muted small">
        <div class="container">
            <p class="mb-0">© 2026 勤怠・シフト・給与管理システム (Kintai Management System)</p>
        </div>
    </footer>

</body>
</html>
