<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="~{::title}">근태·시프트·급여 관리 시스템</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 아이콘 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- FullCalendar 6.1.15 (시프트 스케줄링용) -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-brand {
            font-weight: 700;
            color: #0d6efd !important;
        }
        main {
            flex: 1;
        }
        footer {
            background-color: #ffffff;
            border-top: 1px solid #dee2e6;
        }
    </style>
</head>
<body>

    <!-- 상단 공통 네비게이션 바 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fa-solid fa-business-time me-2"></i>KINTAI SYSTEM
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <!-- 팀원 A 담당 영역 -->
                    <li class="nav-item">
                        <a class="nav-link" href="/members/sample"><i class="fa-solid fa-users me-1"></i>会員一覧 (샘플)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/stores"><i class="fa-solid fa-store me-1"></i>店舗管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/shifts"><i class="fa-regular fa-calendar-days me-1"></i>シフト管理</a>
                    </li>
                    <!-- 팀원 B 담당 영역 -->
                    <li class="nav-item">
                        <a class="nav-link" href="/attendance"><i class="fa-solid fa-clock me-1"></i>勤怠打刻</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/payroll"><i class="fa-solid fa-file-invoice-dollar me-1"></i>給与計算</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="badge bg-primary me-2">ROLE_OWNER</span>
                    <span class="text-muted small">管理者 님</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- 각 페이지 본문이 삽입되는 영역 -->
    <main class="container my-4">
        <div th:replace="${content}">
            <p>기본 본문 영역입니다.</p>
        </div>
    </main>

    <!-- 공통 푸터 -->
    <footer class="py-3 text-center text-muted small">
        <div class="container">
            <p class="mb-0">© 2026 일본형 시프트·근태·급여 정산 시스템 (勤怠・シフト管理システム) · 2인 풀스택 팀 프로젝트</p>
        </div>
    </footer>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery 3.7 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</body>
</html>
