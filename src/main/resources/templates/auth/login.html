<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | 勤怠・給与管理システム</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 440px;
            width: 100%;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            background: #ffffff;
        }
        .login-header {
            padding: 2.2rem 2rem 1.5rem 2rem;
            text-align: center;
            border-bottom: 1px solid #f1f5f9;
        }
        .login-body {
            padding: 2rem;
        }
        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background-color: #e0e7ff;
            color: #3730a3;
            border-radius: 10px;
            font-size: 1.5rem;
            margin-bottom: 0.8rem;
        }
        .btn-primary {
            background-color: #2563eb;
            border-color: #2563eb;
            font-weight: 600;
            padding: 0.65rem 1rem;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
            border-color: #1d4ed8;
        }
        .demo-box {
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1.5rem;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="brand-icon">
            <i class="bi bi-clock-history"></i>
        </div>
        <h4 class="fw-bold text-dark mb-1">勤怠・給与管理システム</h4>
        <p class="text-secondary small mb-0">店舗業務に特化した労基法準拠クラウドサービス</p>
    </div>

    <div class="login-body">
        <!-- エラーメッセージ -->
        <div th:if="${errorMessage != null}" class="alert alert-danger py-2 px-3 small d-flex align-items-center mb-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2 flex-shrink-0"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- ログアウトメッセージ -->
        <div th:if="${logoutMessage != null}" class="alert alert-success py-2 px-3 small d-flex align-items-center mb-3" role="alert">
            <i class="bi bi-check-circle-fill me-2 flex-shrink-0"></i>
            <span th:text="${logoutMessage}"></span>
        </div>

        <!-- ログインフォーム -->
        <form th:action="@{/login-process}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label small fw-semibold text-secondary">メールアドレス</label>
                <div class="input-group">
                    <span class="input-group-text bg-white text-muted"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="email" placeholder="example@kintai.com" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small fw-semibold text-secondary">パスワード</label>
                <div class="input-group">
                    <span class="input-group-text bg-white text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right me-1"></i> ログイン
            </button>
        </form>

        <!-- デモアカウント案内エリア -->
        <div class="demo-box">
            <div class="fw-bold text-dark mb-2 d-flex align-items-center">
                <i class="bi bi-info-circle-fill text-primary me-1"></i> テスト用デモアカウント
            </div>
            <div class="d-flex justify-content-between align-items-center mb-1">
                <span><strong>管理者（オーナー）:</strong> owner@kintai.com / 1234</span>
                <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="setCredentials('owner@kintai.com', '1234')">入力</button>
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <span><strong>従業員（スタッフ）:</strong> staff1@kintai.com / 1234</span>
                <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="setCredentials('staff1@kintai.com', '1234')">入力</button>
            </div>
        </div>
    </div>
</div>

<script>
    function setCredentials(email, password) {
        document.getElementById('email').value = email;
        document.getElementById('password').value = password;
    }
</script>

</body>
</html>
