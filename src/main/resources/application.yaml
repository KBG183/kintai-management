server:
  port: 8081

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kintai_db?useSSL=false&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: 1234  # <-- 여기만 수정하세요!

  jpa:
    hibernate:
      # 이미 1단계에서 직접 테이블을 만들었으므로 엔티티와 DB가 일치하는지 검증만 수행
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false # 개발 중 HTML 수정 시 바로 반영되도록 설정