server:
  port: 8081

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kintai_db?useSSL=false&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: 1234  # 환경에 맞게 수정하세요.

  thymeleaf:
    cache: false # 개발 중 HTML 수정 시 바로 반영되도록 설정

# MyBatis 4.x 연동 설정
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.kintai.domain
  configuration:
    map-underscore-to-camel-case: true # DB 컬럼 snake_case -> Java camelCase 자동 매핑
    default-fetch-size: 100

# 일본 노무·세법 법정 기준값 설정 (2026년 10월 개정 기준, 하드코딩 방지)
kintai:
  legal:
    min-hourly-wage: 1280        # 도쿄도 최저시급 (2026년 10월 개정 기준)
    tax-barrier-default: 1230000 # 연수입의 벽 기본 부양공제 기준 (123만 엔, 구 103만 엔)
